name: Sync upstream skills

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Sync upstreams
        run: python skills/coding-discipline/scripts/sync.py --apply

      - name: Validate
        run: |
          python skills/coding-discipline/scripts/validate.py
          python -m unittest discover -s skills/coding-discipline/tests -v

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/coding-discipline
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync upstream skills"
            git push
          fi
