name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate
        run: python skills/coding-discipline/scripts/validate.py

      - name: Publish with gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --tag "${{ inputs.tag }}"
